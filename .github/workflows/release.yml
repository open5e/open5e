name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to increment"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      release_notes:
        description: "Release notes (leave blank to auto-generate from commits since the last tag)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: staging
          token: ${{ steps.app-token.outputs.token }}

      - name: Sync main into staging
        run: |
          git config user.name "open5e-release-bot[bot]"
          git config user.email "open5e-release-bot[bot]@users.noreply.github.com"
          git fetch origin main staging --tags
          git checkout staging
          git pull origin staging

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "staging already contains all of main"
          else
            echo "Merging main into staging before release"
            if ! git merge origin/main --no-edit -m "chore: sync main into staging before release"; then
              echo "::error::Could not merge main into staging."
              echo "::error::Resolve conflicts on staging (keep staging's version for duplicate release changes), push, then re-run."
              exit 1
            fi
            git push origin staging
          fi

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git fetch --tags origin
          latest_tag="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          latest_tag="${latest_tag:-v0.0.0}"
          version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$version"
          major="${major:-0}"; minor="${minor:-0}"; patch="${patch:-0}"

          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::Unknown bump type: $BUMP"; exit 1 ;;
          esac

          new_version="v${major}.${minor}.${patch}"
          if git rev-parse "refs/tags/${new_version}" >/dev/null 2>&1; then
            echo "::error::Tag ${new_version} already exists"
            exit 1
          fi
          echo "Previous tag: ${latest_tag} -> New version: ${new_version}"
          echo "version=${new_version}" >> "$GITHUB_OUTPUT"

      - name: Resolve staging ref
        id: refs
        run: |
          staging_sha="$(git rev-parse origin/staging)"
          echo "staging_sha=${staging_sha}" >> "$GITHUB_OUTPUT"
          echo "Release target: origin/staging @ ${staging_sha}"

      - name: Generate release notes
        env:
          MANUAL_NOTES: ${{ inputs.release_notes }}
        run: |
          if [[ -n "${MANUAL_NOTES}" ]]; then
            printf '%s\n' "$MANUAL_NOTES" > release-notes.md
          else
            bash .github/scripts/generate-release-notes.sh origin/staging > release-notes.md
          fi

      - name: Create release tag on staging
        env:
          VERSION: ${{ steps.version.outputs.version }}
          STAGING_SHA: ${{ steps.refs.outputs.staging_sha }}
        run: |
          git tag -a "$VERSION" -m "Release $VERSION" "$STAGING_SHA"
          git push origin "$VERSION"

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ steps.refs.outputs.staging_sha }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          prerelease: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Open promotion PR (staging -> main)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head staging \
            --title "Release ${VERSION}" \
            --body-file release-notes.md \
          || echo "::warning::A promotion PR from staging to main may already be open."
